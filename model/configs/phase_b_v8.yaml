# Phase B v8 -- v7 with the closure term gated on the UNREPAIRED shell.
#
# ONE variable changes from v7: `closure_gate: true`. Data, architecture,
# optimiser, schedule, iteration count, seed and both topology weights
# are all v7's.
#
# Why. v6/v7 seal 98.4 % / 99.4 % of buildings against 92.1 % for real,
# and the evaluation reads that as the loss over-generalising. It is only
# half that. Measured (claude.md §69.2):
#
#   interior drawn for                          98.9 % of targets
#     ...of which needed a 1-voxel closing first  4.8 %
#   raw training shells watertight (strict 6-conn) 95.9 %
#   v6 / v7 generated                           98.4 % / 99.4 %
#
# The `interior` channel was built by flood-filling each real building AND
# applying a one-voxel morphological closing where the raw shell would not
# close. The leak term then seals the shell around whatever interior is
# present, so the model reproduces the REPAIRED rate. Part of the overshoot
# is not the objective's -- it was introduced three chapters upstream by a
# preprocessing step written before the loss that promoted it into a
# training signal existed.
#
# The fix is a per-sample gate, not a per-class weight. The target already
# records the answer for every building individually in `interior_status`:
#
#   filled  9413 (94.1 %)  enclosed directly -- raw shell was watertight
#   closed   480 ( 4.8 %)  only after the morphological repair
#   open     107 ( 1.1 %)  never enclosed
#
# With the gate on, `filled` buildings keep their interior and are asked to
# close around it; for the other 5.9 % the interior is dissolved back to
# empty, so the target is the unrepaired shell and the closure term has
# nothing there to enforce.
#
# Function-conditioning was considered and rejected: agricultural sheds are
# 2.5 % open against residential 0.9 %, far too thin a signal to steer
# anything, and the per-building answer is already available.
#
# PREDICTION, registered in advance. Watertightness settles in the
# mid-nineties (~94-96 %) rather than 98-99 %; coverage and 1-NNA recover
# part of the v6/v7 loss; occupancy stays near real at ~0.82 %.
# If watertightness stays at 98-99 %, the overshoot is NOT the repair's
# doing and this explanation is wrong -- report that, do not explain it away.
#
# What to watch, and the trap (unchanged from §63.5). Watertightness and
# occupancy TOGETHER. A LOWER watertightness is the intended outcome here,
# which inverts the usual reading: success is moving TOWARDS real, not up.
#
# Sanity check at iteration 1. The CE term is unchanged -- a uniform softmax
# over 7 classes gives ln 7 = 1.946 whichever class is true -- and the leak
# term is masked to 94.1 % of samples but still averaged over the admitted
# ones, so its scale is unchanged. Initial loss should therefore land at
# v7's 2.017, NOT at v5's 1.946. A reading of 1.946 means the topology
# terms are inert; a much larger reading means the mask is scaling wrongly.
#
# Run:
#   ./model/.venv/bin/python -m model.src.train --config model/configs/phase_b_v8.yaml

shards_dir: tensorbuilding/shards_v5
manifest_path: tensorbuilding/shards_v5/manifest.csv
subset: 0

batch_size: 8
num_workers: 2

# --- architecture: IDENTICAL to v5, v6, v7 ---------------------------
base_channels: 32
channel_mults: [1, 2, 4, 4]
cond_dim: 256
time_embed_dim: 256
blocks_per_level: 2

# --- diffusion + optimiser: IDENTICAL to v5, v6, v7 ------------------
n_timesteps: 1000
lr: 0.0001
warmup_iters: 1000
weight_decay: 0.0005
ema_decay: 0.999
p_drop_cond: 0.1
grad_clip: 0.5
amp: true
parameterization: x0
fg_loss_weight: 0.0

# --- topology terms: IDENTICAL to v7 ---------------------------------
topo_w_cldice: 0.0005
topo_w_leak: 0.25
topo_skel_iters: 3
topo_flood_steps: 32

# --- v8: the one change ----------------------------------------------
closure_gate: true

iters: 100000
log_every: 100
save_every: 2000
sample_every: 2500
sample_seeds: [42, 43, 44, 45]
sample_n_steps: 50
sample_guidance: 0.0        # see claude.md §44

out_dir: model/checkpoints/phase_b_v8
seed: 42
