# Phase A — smoke training (claude.md §10).
# Goal: verify the architecture runs end-to-end on the 5cities_balanced
#       shards, that the loss decreases over a few hundred iterations, and
#       that a checkpoint saves cleanly. Not a real model run.

# -- data --------------------------------------------------------------
shards_dir: tensorbuilding/shards
manifest_path: tensorbuilding/shards/manifest.csv
subset: 256                # use a small slice for the smoke
batch_size: 4
num_workers: 2

# -- model -------------------------------------------------------------
base_channels: 16          # tiny U-Net for Phase A (~few hundred K params)
channel_mults: [1, 2, 4, 4]
cond_dim: 128
time_embed_dim: 128
blocks_per_level: 1

# -- diffusion + training --------------------------------------------
n_timesteps: 1000
lr: 2.0e-4
weight_decay: 0.0
ema_decay: 0.999
p_drop_cond: 0.1
grad_clip: 1.0
amp: true                  # bf16 autocast on CUDA

iters: 300                 # ~2-5 min on the RTX 4000 Ada at batch 4
log_every: 25
save_every: 0              # don't save a checkpoint from the smoke

# -- output ----------------------------------------------------------
out_dir: model/checkpoints/phase_a_smoke
seed: 42
