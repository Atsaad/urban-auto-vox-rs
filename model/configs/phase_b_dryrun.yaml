# Phase B dry-run: same architecture, tiny run, verifies wiring + VRAM.
shards_dir: tensorbuilding/shards
manifest_path: tensorbuilding/shards/manifest.csv
subset: 32
batch_size: 4                # smaller batch during dry-run to fit VRAM comfortably
num_workers: 0

base_channels: 64
channel_mults: [1, 2, 4, 4]
cond_dim: 256
time_embed_dim: 256
blocks_per_level: 2

n_timesteps: 1000
lr: 2.0e-4
weight_decay: 1.0e-4
ema_decay: 0.999
p_drop_cond: 0.1
grad_clip: 1.0
amp: true

iters: 5
log_every: 1
save_every: 5
sample_every: 5
sample_seeds: [42, 43]
sample_n_steps: 10          # only 10 DDIM steps -> quick
sample_guidance: 1.5

out_dir: model/checkpoints/phase_b_dryrun
seed: 42
