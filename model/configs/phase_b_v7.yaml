# Phase B v7 -- v6 with a weaker closure term.
#
# ONE variable changes from v6: topo_w_leak 1.0 -> 0.25. Data,
# architecture, optimiser, schedule, iteration count, seed and the
# clDice weight are all v6's.
#
# Why. v6 solved closure (40.3 % -> 98.4 % watertight) and overshot:
# it seals MORE reliably than reality does (real 92.1 %), because some
# real agricultural and non-residential buildings are genuinely open and
# the loss taught the model that buildings always close. It paid for
# that in distributional realism -- 1-NNA 71.9 % -> 79.4 %, coverage
# 40.9 % -> 37.9 % (claude.md §64.3).
#
# The open question is the SHAPE of that exchange. With v5 sitting at
# topo_w_leak = 0 and v6 at 1.0, this run supplies the middle point:
#
#   w_leak   watertight   1-NNA    coverage
#   0.00     40.3 %       71.9 %   40.9 %     (v5)
#   0.25     ?            ?        ?          (this run)
#   1.00     98.4 %       79.4 %   37.9 %     (v6)
#
# Three points is a curve rather than an anecdote, and it answers the
# question a reviewer asks first: is the trade-off shallow -- most of the
# closure gain available at a fraction of the distributional cost -- or
# sharp? Either answer is publishable; only the un-swept single setting
# is not.
#
# 0.25 rather than 0.5 because the interesting region is likely nearer
# zero: the leak term's gradient grows as the shell sharpens, so a
# quarter of the weight is not a quarter of the effect. If this run lands
# close to v6 on watertightness, the next point goes lower still.
#
# What to watch, and the trap (unchanged from §63.5). Watertightness and
# occupancy TOGETHER. Guidance once bought watertightness by inflating
# the building until it happened to seal (§44.4). v6 passed that check --
# occupancy 0.835 % against real 0.816 %, solidity 0.510 against 0.584 --
# and any successor must pass it too before its number is believed.
#
# Success here is NOT "beats v6 on watertightness". It is a point that
# makes the trade-off legible. A run at 90 % watertight and 73 % 1-NNA
# would be the best model in the thesis; a run at 45 % and 72 % would
# show the exchange is steep and that v6's setting was the right one.
#
# Run:
#   ./model/.venv/bin/python -m model.src.train --config model/configs/phase_b_v7.yaml

shards_dir: tensorbuilding/shards_v5
manifest_path: tensorbuilding/shards_v5/manifest.csv
subset: 0

batch_size: 8
num_workers: 2

# --- architecture: IDENTICAL to v5 and v6 ----------------------------
base_channels: 32
channel_mults: [1, 2, 4, 4]
cond_dim: 256
time_embed_dim: 256
blocks_per_level: 2

# --- diffusion + optimiser: IDENTICAL to v5 and v6 -------------------
n_timesteps: 1000
lr: 0.0001
warmup_iters: 1000
weight_decay: 0.0005
ema_decay: 0.999
p_drop_cond: 0.1
grad_clip: 0.5
amp: true
parameterization: x0
fg_loss_weight: 0.0

# --- v7: the one change ----------------------------------------------
topo_w_cldice: 0.0005       # unchanged from v6
topo_w_leak: 0.25           # v6 used 1.0
topo_skel_iters: 3
topo_flood_steps: 32

iters: 100000
log_every: 100
save_every: 2000
sample_every: 2500
sample_seeds: [42, 43, 44, 45]
sample_n_steps: 50
sample_guidance: 0.0        # see claude.md §44

out_dir: model/checkpoints/phase_b_v7
seed: 42
