# Phase B v4 -- conditional 5-city training (claude.md §26.13).
#
# History:
#   v1 diverged permanently at iter 9500 (§11.9).
#   v2 stopped at iter 17.8K: samples 74-77 % occupied vs real 0.33 % (§11.10).
#   v3 stopped at iter 20K: fg_weighted MSE actually made samples worse
#     (80-82 % occupancy). The class-imbalance diagnosis was right, but the
#     fix (weighted MSE on epsilon) was wrong: it forces the model to
#     predict noise more precisely on foreground voxels during TRAINING,
#     but doesn't teach it to hallucinate structure during SAMPLING from
#     pure noise. See §11.11.
#
# v4 pivot: **x0-parameterization + cross-entropy loss**.
#   - Model output re-interpreted as raw logits over the 6 semantic classes.
#   - Loss = softmax cross-entropy against x0.argmax(dim=1).
#   - Sampler converts softmax(logits) -> x0_pred -> DDIM step.
#   - Class imbalance handled intrinsically by the softmax bias: if the
#     training marginal is 99.7 % empty, the model's default output biases
#     toward empty for free -- no weighting knob needed.
# All other hyperparameters preserved from v2 (they proved stable).

# -- data --------------------------------------------------------------
shards_dir: tensorbuilding/shards
manifest_path: tensorbuilding/shards/manifest.csv
subset: 0                    # full 10 000-building dataset
batch_size: 8                # 14 M model + level-0 activations (32ch @ 64^3)
                             # OOM at batch 16; batch 8 sits at ~14 GB peak
num_workers: 2

# -- model (Phase B v3: ~14 M params, unchanged from v2) --------------
base_channels: 32
channel_mults: [1, 2, 4, 4]
cond_dim: 256
time_embed_dim: 256          # must match cond_dim (train.py enforces via +)
blocks_per_level: 2

# -- diffusion + training ---------------------------------------------
n_timesteps: 1000
lr: 1.0e-4                   # peak LR, halved from v1 for stability
warmup_iters: 1000           # linear 0 -> 1e-4 over first 1000 iters
weight_decay: 5.0e-4         # tripled from v1 to regularise 14 M / 10 K
ema_decay: 0.999
p_drop_cond: 0.1
grad_clip: 0.5               # tighter clip catches early spikes
amp: true                    # bf16 autocast on CUDA
parameterization: x0         # NEW in v4: predict x0 (logits) not eps
                             # options: "eps" (DDPM, MSE loss) or "x0" (CE loss)
fg_loss_weight: 0.0          # ignored when parameterization=x0

iters: 100000
log_every: 100
save_every: 5000             # smaller model -> smaller ckpt -> save often

# -- progression tracker (§26 in claude.md) ---------------------------
sample_every: 2500
sample_seeds: [42, 43, 44, 45]
sample_n_steps: 50
sample_guidance: 1.5

# -- output -----------------------------------------------------------
out_dir: model/checkpoints/phase_b_v4
seed: 42
